name: Check tenders

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button
    inputs:
      test:
        description: "Only send a test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tender-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Telegram check
        if: ${{ inputs.test }}
        env:
          T: ${{ secrets.TELEGRAM_TOKEN }}
          API: ${{ secrets.TELEGRAM_API }}
        run: |
          API="${API:-https://api.telegram.org}"
          echo "getMe:"; curl -s -m 40 -w " [%{http_code} %{time_total}s]\n" "$API/bot$T/getMe" | sed "s/$T/***/g" || true
          echo "webhook:"; curl -s -m 40 -w " [%{http_code} %{time_total}s]\n" "$API/bot$T/getWebhookInfo" || true
          echo "updates:"; curl -s -m 40 -w " [%{http_code} %{time_total}s]\n" "$API/bot$T/getUpdates?limit=5" | head -c 1500 || true

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python tender_bot.py --test
          else
            python tender_bot.py
          fi

      - name: Save memory (seen lots)
        if: always()
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add -f seen_lots.json chat_id.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update seen lots [skip ci]" && git push)
